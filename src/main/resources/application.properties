spring.application.name=GestBanda
server.port=3000
spring.jpa.database=postgresql
spring.sql.init.platform=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestbanda}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=classpath:db/changelog/changelog.sql

spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.messages.encoding=UTF-8

spring.mvc.converters.preferred-json-mapper=jackson

spring.jackson.time-zone=UTC


imgur.clientID=${IMGUR_CLIENT_ID:}
imgur.uploadUrl=https://api.imgur.com/3/image

jwt.secret=${JWT_SECRET}
