services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestbanda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestbanda"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gestbanda
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Dev-only default so `docker compose up` works out of the box. Set JWT_SECRET in .env for anything else.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789abcdef}
      IMGUR_CLIENT_ID: ${IMGUR_CLIENT_ID:-}
    ports:
      - "3000:3000"

volumes:
  db-data:
